*{box-sizing:border-box;margin:0;padding:0}
body{background:#10173D;font-family:'Poppins',sans-serif;color:#F0F2F5;min-height:100vh;padding:24px 18px 60px}
.card{background:#182048;border:1px solid #2A3362;border-radius:12px;padding:16px}
.kpi-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kpi{background:#182048;border:1px solid #2A3362;border-radius:12px;padding:14px 16px;flex:1 1 130px;min-width:120px}
.kpi-label{font-size:10px;font-weight:600;color:#5C6370;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:800;color:#F0F2F5;line-height:1}
.kpi-sub{font-size:10px;color:#9BA3B0;margin-top:4px}
.tab-row{display:flex;background:#10173D;border-radius:10px;max-width:420px;margin:0 auto 14px;border:1px solid #2A3362;overflow:hidden}
.tab-btn{flex:1;padding:10px 14px;border:none;cursor:pointer;font-weight:700;font-size:12px;font-family:'Poppins',sans-serif;background:#10173D;color:#5C6370;transition:all .2s}
.tab-btn.active{background:#34FFA4;color:#10173D}
.pill-row{display:flex;gap:6px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;border:1px solid #2A3362;cursor:pointer;font-weight:600;font-size:11px;font-family:'Poppins',sans-serif;background:transparent;color:#5C6370;transition:all .2s}
.pill.active{background:rgba(52,255,164,.12);border-color:#34FFA4;color:#34FFA4}
.sec{display:flex;align-items:center;gap:8px;margin:26px 0 12px}
.sec h3{font-size:13px;font-weight:700;color:#F0F2F5;margin:0}
.sec-sub{font-size:10px;color:#5C6370;margin-top:1px}
.story{background:linear-gradient(135deg,#182048 0%,#0D1535 100%);border:1px solid rgba(52,255,164,.2);border-radius:12px;padding:16px 18px;margin-top:22px}
.story-bar{width:3px;height:14px;border-radius:2px;background:#34FFA4;flex-shrink:0}
.story-text{font-size:12px;line-height:1.8;color:#9BA3B0}
.ep-row{background:#182048;border-radius:10px;padding:11px 14px;border:1px solid #2A3362;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.side-by-side{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.half-card{flex:1 1 280px;background:#182048;border:1px solid #2A3362;border-radius:12px;padding:16px;display:flex;flex-direction:column}
.progress-bar{height:4px;border-radius:2px;background:#2A3362;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:2px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#10173D}
::-webkit-scrollbar-thumb{background:#2A3362;border-radius:3px}
button:focus{outline:none}
</style>

// ── HELPERS ──
const sumK=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const avgK=(a,k)=>a.length?sumK(a,k)/a.length:0;
const fmt=n=>typeof n==="number"?n.toLocaleString():n;

let platform="linkedin", period="ytd", podSeries="ddot";
let charts={};

function getPosts(){
  if(period==="jan") return LI_JAN;
  if(period==="feb") return LI_FEB;
  if(period==="mar") return LI_MAR;
  if(period==="apr") return LI_APR;
  if(period==="may") return LI_MAY;
  return [...LI_JAN,...LI_FEB,...LI_MAR,...LI_APR,...LI_MAY];
}
function getActive(){return getPosts().filter(p=>p.eng>0);}

function pLabel(){
  if(period==="jan") return "January 2026";
  if(period==="feb") return "February 2026";
  if(period==="mar") return "March 2026";
  if(period==="apr") return "April 2026";
  if(period==="may") return "May 2026";
  if(period==="2025") return "2025 Full Year";
  return "Jan–May 2026 YTD";
}

function liStats(){
  const active=getActive();
  const followers={jan:98,feb:22,mar:15,apr:45,may:76,ytd:256};
  const totalFollowers={jan:2335,feb:2357,mar:2372,apr:2417,may:2393,ytd:2393};
  return {
    posts:getPosts().length,
    imp:sumK(active,"imp"),
    eng:avgK(active,"eng").toFixed(1),
    clicks:sumK(active,"clicks"),
    likes:sumK(active,"likes"),
    newFollowers:followers[period]||256,
    totalFollowers:totalFollowers[period]||2393,
  };
}

  if(period==="may") return GA_26_MO[4];
  return {
    users:GA_26_MO.reduce((s,m)=>s+m.users,0),
    sessions:GA_26_MO.reduce((s,m)=>s+m.sessions,0),
    pv:GA_26_MO.reduce((s,m)=>s+m.pv,0),
  };
}

function kpi(label,value,sub){
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:""}</div>`;
}

  return `<div class="sec"><span style="font-size:15px">${icon}</span><div><h3>${title}</h3>${sub?`<div class="sec-sub">${sub}</div>`:""}</div></div>`;
}

}

    return `<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
      <div style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:${i===0?"#10173D":C.t1};background:${i===0?C.green:i===1?C.border:"transparent"};border:${i>1?`1px solid ${C.border}`:"none"}">${i+1}</div>

    feb:`<strong style="color:${C.green}">Day in the Life: Caleb dominated</strong> with 77.8% engagement + 614 clicks. Valentine's content averaged 37% combined. The Railroads Friends blog sparked a late-month website surge. 18 posts = 3.6x February 2025 cadence.`,
    mar:`March was defined by <strong style="color:${C.green}">people-first content dominating</strong> — Employee Appreciation (70.4% eng, 647 clicks) + Team Childhood Photos (72.4% eng, 604 clicks). National Cocktail Day hit 63.3%. 4 of the top 5 posts were team photos or spotlights.`,
    apr:`April's standout was the <strong style="color:${C.green}">Demurrage Infographic Carousel</strong> at 66.7% engagement + 195 clicks. Harris Hot Takes on Earnings Call (16.6%) + Consist Takeaways Carousel (29.8%) showed industry analysis content resonating strongly. 21 posts vs. 6 in April 2025 — a 3.5x cadence increase.`,
    may:`May was Telegraph's <strong style="color:${C.green}">most industry-news-driven month yet</strong> — the OpenTug press release led impressions at 1,394 (the highest single post since January's AITX spike). The STB Guide for Shippers Carousel hit 33% engagement + 99 clicks, and the Barge + Rail Infographic delivered 36.8% eng + 164 clicks. The Demurrage LinkedIn Article (737 imp, 47 reactions) showed that long-form content on LinkedIn is building traction. +76 followers — steady organic growth continuing.`,

  return `<div style="text-align:center;margin-bottom:16px"><span style="font-size:15px;font-weight:700">${pl} · LinkedIn</span></div>

    ${kpi("Total Posts",s.posts,period==="ytd"?"Jan–May 2026":pLabel())}

    ${kpi("Total Reactions",fmt(s.likes),(s.likes/s.posts).toFixed(1)+" avg per post")}
    ${kpi("New Followers",s.newFollowers,"Organic this period")}
    ${kpi("Total Followers",fmt(s.totalFollowers),"End of period")}
  </div>
  ${secHTML("📊","Post Performance","Impressions per post with engagement rate overlay")}
  <div class="card"><canvas id="chartLI" height="200"></canvas></div>
  ${secHTML("🥧","Content Breakdown + Top Posts","Format mix and avg engagement · Top 10 posts by engagement rate")}

    <div class="half-card">

function renderCharts(){
  Object.values(charts).forEach(c=>c.destroy()); charts={};
  const grid="rgba(42,51,98,0.8)";
  const tick={color:C.t3,font:{size:9,family:"Poppins"}};
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:C.bgCard,titleColor:C.green,bodyColor:C.t2,borderColor:C.border,borderWidth:1}}};

  if(platform==="linkedin"){
    if(period==="2025"){
      const el=document.getElementById("chart2025LI");
      if(el) charts.li2025=new Chart(el,{type:"bar",data:{labels:LI_2025.map(m=>m.m),datasets:[{label:"Posts",data:LI_2025.map(m=>m.posts),backgroundColor:C.green+"cc",borderRadius:3,yAxisID:"y"},{label:"Avg Eng %",data:LI_2025.map(m=>m.avgEng),type:"line",borderColor:C.periwinkle,backgroundColor:"transparent",borderWidth:2,pointRadius:2,yAxisID:"y1"}]},options:{...base,scales:{x:{ticks:tick,grid:{color:grid}},y:{ticks:tick,grid:{color:grid}},y1:{position:"right",ticks:{...tick,color:C.periwinkle},grid:{display:false}}}}});
    } else {
      const active=getActive();
      const elLI=document.getElementById("chartLI");
      if(elLI){
        charts.li=new Chart(elLI,{type:"bar",data:{labels:active.map(p=>p.date.replace(/Jan |Feb |Mar |Apr |May /,"")),datasets:[{label:"Impressions",data:active.map(p=>p.imp),backgroundColor:C.green+"cc",borderRadius:3,yAxisID:"y"},{label:"Eng %",data:active.map(p=>p.eng),type:"line",borderColor:C.periwinkle,backgroundColor:"transparent",borderWidth:2,pointRadius:2,yAxisID:"y1"}]},options:{...base,scales:{x:{ticks:{...tick,maxRotation:45,autoSkip:true,maxTicksLimit:period==="ytd"?22:18},grid:{color:grid}},y:{ticks:tick,grid:{color:grid}},y1:{position:"right",ticks:{...tick,color:C.periwinkle},grid:{display:false}}}}});
      }
      const elPie=document.getElementById("chartPie");
      if(elPie){
        const counts={};
        active.forEach(p=>{counts[p.type]=(counts[p.type]||0)+1;});
        const entries=Object.entries(counts);
        charts.pie=new Chart(elPie,{type:"doughnut",data:{labels:entries.map(([n])=>n),datasets:[{data:entries.map(([,v])=>v),backgroundColor:entries.map(([n])=>TYPE_COLORS[n]||C.blue),borderWidth:2,borderColor:C.bgCard}]},options:{...base,cutout:"55%"}});
      }
    }
  }

  if(platform==="website"){
    if(period==="2025"){
      const el=document.getElementById("chart2025GA");
      if(el) charts.ga2025=new Chart(el,{type:"bar",data:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],datasets:[{label:"Sessions",data:GA_2025_SESSIONS,backgroundColor:C.green+"cc",borderRadius:3}]},options:{...base,scales:{x:{ticks:tick,grid:{color:grid}},y:{ticks:tick,grid:{color:grid}}}}});
    } else {
      const el=document.getElementById("chartGA");
      if(el){
        let data=period==="jan"?GA_JAN:period==="feb"?GA_FEB:period==="mar"?GA_MAR:period==="apr"?GA_APR:period==="may"?GA_MAY:[...GA_JAN,...GA_FEB,...GA_MAR,...GA_APR,...GA_MAY];
        if(period==="ytd"){const step=4;data=data.filter((_,i)=>i%step===0);}
        charts.ga=new Chart(el,{type:"line",data:{labels:data.map((_,i)=>i+1+""),datasets:[{label:"Sessions",data,borderColor:C.green,backgroundColor:C.green+"22",borderWidth:2,pointRadius:0,fill:true,tension:.3}]},options:{...base,scales:{x:{ticks:{...tick,maxTicksLimit:15},grid:{color:grid}},y:{ticks:tick,grid:{color:grid},beginAtZero:true}}}});
      }
    }
  }

  if(platform==="podcast"){
    const el=document.getElementById("chartPod");
    if(el) charts.pod=new Chart(el,{type:"line",data:{labels:DDOT_TREND_LABELS,datasets:[{label:"Downloads",data:DDOT_TREND,borderColor:C.green,backgroundColor:C.green+"22",borderWidth:2,pointRadius:3,fill:true,tension:.3}]},options:{...base,scales:{x:{ticks:{...tick,maxRotation:45,autoSkip:false},grid:{color:grid}},y:{ticks:tick,grid:{color:grid},beginAtZero:true}}}});
  }
}

function attachListeners(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{platform=b.dataset.tab;renderApp();}));
  document.querySelectorAll("[data-period]").forEach(b=>b.addEventListener("click",()=>{period=b.dataset.period;renderApp();}));
  document.querySelectorAll("[data-pod]").forEach(b=>b.addEventListener("click",()=>{podSeries=b.dataset.pod;renderApp();}));
}

renderApp();
</script>
