*{box-sizing:border-box;margin:0;padding:0}
body{background:#10173D;font-family:'Poppins',sans-serif;color:#F0F2F5;min-height:100vh;padding:24px 18px 60px}
.card{background:#182048;border:1px solid #2A3362;border-radius:12px;padding:16px}
.kpi-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kpi{background:#182048;border:1px solid #2A3362;border-radius:12px;padding:14px 16px;flex:1 1 130px;min-width:120px}
.kpi-label{font-size:10px;font-weight:600;color:#5C6370;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:800;color:#F0F2F5;line-height:1}
.kpi-sub{font-size:10px;color:#9BA3B0;margin-top:4px}
.tab-row{display:flex;background:#10173D;border-radius:10px;max-width:420px;margin:0 auto 14px;border:1px solid #2A3362;overflow:hidden}
.tab-btn{flex:1;padding:10px 14px;border:none;cursor:pointer;font-weight:700;font-size:12px;font-family:'Poppins',sans-serif;background:#10173D;color:#5C6370;transition:all .2s}
.tab-btn.active{background:#34FFA4;color:#10173D}
.pill-row{display:flex;gap:6px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;border:1px solid #2A3362;cursor:pointer;font-weight:600;font-size:11px;font-family:'Poppins',sans-serif;background:transparent;color:#5C6370;transition:all .2s}
.pill.active{background:rgba(52,255,164,.12);border-color:#34FFA4;color:#34FFA4}
.sec{display:flex;align-items:center;gap:8px;margin:26px 0 12px}
.sec h3{font-size:13px;font-weight:700;color:#F0F2F5;margin:0}
.sec-sub{font-size:10px;color:#5C6370;margin-top:1px}
.story{background:linear-gradient(135deg,#182048 0%,#0D1535 100%);border:1px solid rgba(52,255,164,.2);border-radius:12px;padding:16px 18px;margin-top:22px}
.story-bar{width:3px;height:14px;border-radius:2px;background:#34FFA4;flex-shrink:0}
.story-text{font-size:12px;line-height:1.8;color:#9BA3B0}
.ep-row{background:#182048;border-radius:10px;padding:11px 14px;border:1px solid #2A3362;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.side-by-side{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.half-card{flex:1 1 280px;background:#182048;border:1px solid #2A3362;border-radius:12px;padding:16px;display:flex;flex-direction:column}
.progress-bar{height:4px;border-radius:2px;background:#2A3362;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:2px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#10173D}
::-webkit-scrollbar-thumb{background:#2A3362;border-radius:3px}
button:focus{outline:none}
</style>

    jun:{cur:[1900,2352,3100],prev:[1868,2282,3711],label:"Jun"},
    jul:{cur:[1891,2293,3407],prev:[1695,2042,3298],label:"Jul"},
  };
  const yoy=yoyMap[period];
  const yoyCards=yoy?["Users","Sessions","Page Views"].map((l,i)=>{
    const cur=yoy.cur[i],prev=yoy.prev[i];
    const chg=(((cur-prev)/prev)*100).toFixed(0),up=chg>0;
    return `<div style="background:${C.bgCard};border:1px solid ${C.border};border-radius:10px;padding:12px 14px;flex:1;min-width:100px">
      <div style="font-size:9px;color:${C.t3};font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">${l} YoY</div>
      <div style="font-size:18px;font-weight:800;color:${up?C.green:C.red}">${up?"+":""}${chg}%</div>
      <div style="font-size:9px;color:${C.t2};margin-top:2px">${fmt(cur)} vs ${fmt(prev)}</div>
      <div style="font-size:9px;color:${C.t3}">${yoy.label} '26 vs ${yoy.label} '25</div>
    </div>`;
  }).join(""):"";

  const stories={
    jan:`A <strong style="color:${C.green}">massive 3-day spike Jan 14–16</strong> driven by the AITX press release. Users more than doubled YoY (3,192 vs. 1,359).`,
    feb:`Late-month surge <strong style="color:${C.green}">(Feb 24–28)</strong> driven by the Railroads Friends merger blog — the site's #2 most visited page. Users more than doubled YoY.`,
    mar:`March opened strong with a <strong style="color:${C.green}">spike in the first week</strong> tied to Employee Appreciation + Talk Track content. Users down vs. March 2025 — that month was an outlier boosted by major partnership announcements.`,
    apr:`April's <strong style="color:${C.green}">biggest spike hit April 19–21</strong> tied to the Q2 Market Consist post (658 impressions, strong click-through). Users doubled YoY (3,100 vs. 1,543) — the strongest month-over-month recovery of the quarter. Direct traffic dominated at 70% but Organic Social had the highest session quality at 53% engagement rate.`,
    may:`May's <strong style="color:${C.green}">peak day was May 9</strong> (~175 sessions), with a second spike on <strong style="color:${C.green}">May 26</strong> (~160 sessions) tied to the Open Tug PR — plus a smaller run-up May 15-16 (~150s) around the Telegraph Demurrage launch. 2,577 sessions for the month, averaging 83/day. Users up YoY (~1,991 vs. 1,435).`,
    jun:`June brought <strong style="color:${C.green}">1.9K users</strong> and 3.1K page views, with Home–Telegraph as the clear top page (1.7K views). Engaged sessions per active user (0.43) and avg engagement time (19s) both ran ahead of the Jan–Jun average — a sign traffic quality held up even as the DDOT Erica Ray episodes drove volume. Users about flat YoY (1,900 vs. 1,868).`,
    jul:`July's traffic was <strong style="color:${C.green}">homepage-heavy</strong> — 1,754 of 3,407 total page views (51%) landed on the homepage alone. The July 15/26 Talk Track episode pages and the Trestle + Triathlon announcement pages picked up modest but real traffic. Watch out: Singapore, Ashburn, and Boardman show up as top "cities" in the raw geo data — all three are cloud/datacenter hubs, so July's 1,891 users figure likely carries some bot inflation, similar to the Q1 pattern already flagged elsewhere in this dashboard. Users essentially flat YoY (1,891 vs. 1,695, +12%).`,
    ytd:`<strong style="color:${C.green}">~17K users + 20K sessions in Jan–Jul 2026</strong> — up significantly vs. same period 2025. LinkedIn remains the primary traffic spike driver. Organic Social traffic delivers the highest quality visits per session.`,
  };

  return `<div style="text-align:center;margin-bottom:16px"><span style="font-size:15px;font-weight:700">${pl} · Website</span></div>
  <div class="kpi-grid">
    ${kpi("Active Users",fmt(g.users),period==="ytd"?"Jan–Jul 2026 total":pl)}
    ${kpi("Sessions",fmt(g.sessions),period==="ytd"?"Jan–Jul 2026 total":pl)}
    ${kpi("Page Views",fmt(g.pv),period==="ytd"?"Jan–Jul 2026 total":pl)}
  </div>
  ${yoy?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${yoyCards}</div>`:""}
  ${secHTML("📈","Daily Traffic","Sessions by day")}
  ${["jun","jul"].includes(period)
    ? `<div class="card" style="font-size:11px;color:${C.t3};text-align:center;padding:30px 16px">Daily breakdown isn't in yet for ${pl} — GA4 only gave us the monthly rollup. Pull a daily custom report for this month and I'll chart it.</div>`
    : `<div class="card"><canvas id="chartGA"></canvas></div>`}
  ${period!=="ytd"?buildAudienceInsights():""}
  ${storyHTML(pl+" — Key Takeaways",stories[period]||stories.ytd)}`;
}

function buildPodcast(){

      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:${C.t1};font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ep.title}</div>

    ${kpi("Last 7 Days",TT_LAST7,"Downloads")}
  </div>
  <div class="card" style="margin-bottom:8px">
    <div class="kpi-label" style="margin-bottom:10px">Talk Track — Platform Breakdown</div>

      ${TT_APPS.map(a=>`<div style="display:flex;align-items:center;gap:10px">
        <div style="width:150px;font-size:11px;color:${C.t2};flex-shrink:0">${a.app}</div>

        <div style="width:65px;text-align:right;font-size:11px;font-weight:700;color:${C.t1};flex-shrink:0">${a.pct}% <span style="color:${C.t3};font-weight:400">(${a.count})</span></div>

function renderCharts(){
  Object.values(charts).forEach(c=>c.destroy()); charts={};
  const grid="rgba(42,51,98,0.8)";
  const tick={color:C.t3,font:{size:9,family:"Poppins"}};
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:C.bgCard,titleColor:C.green,bodyColor:C.t2,borderColor:C.border,borderWidth:1}}};

  if(platform==="linkedin"){
    if(period==="2025"){
      const el=document.getElementById("chart2025LI");
      if(el) charts.li2025=new Chart(el,{type:"bar",data:{labels:LI_2025.map(m=>m.m),datasets:[{label:"Posts",data:LI_2025.map(m=>m.posts),backgroundColor:C.green+"cc",borderRadius:3,yAxisID:"y"},{label:"Avg Eng %",data:LI_2025.map(m=>m.avgEng),type:"line",borderColor:C.periwinkle,backgroundColor:"transparent",borderWidth:2,pointRadius:2,yAxisID:"y1"}]},options:{...base,scales:{x:{ticks:tick,grid:{color:grid}},y:{ticks:tick,grid:{color:grid}},y1:{position:"right",ticks:{...tick,color:C.periwinkle},grid:{display:false}}}}});
    } else {
      const active=getActive();
      const elLI=document.getElementById("chartLI");
      if(elLI){
        charts.li=new Chart(elLI,{type:"bar",data:{labels:active.map(p=>p.date.replace(/Jan |Feb |Mar |Apr |May |Jun |Jul /,"")),datasets:[{label:"Impressions",data:active.map(p=>p.imp),backgroundColor:C.green+"cc",borderRadius:3,yAxisID:"y"},{label:"Eng %",data:active.map(p=>p.eng),type:"line",borderColor:C.periwinkle,backgroundColor:"transparent",borderWidth:2,pointRadius:2,yAxisID:"y1"}]},options:{...base,scales:{x:{ticks:{...tick,maxRotation:45,autoSkip:true,maxTicksLimit:period==="ytd"?20:18},grid:{color:grid}},y:{ticks:tick,grid:{color:grid}},y1:{position:"right",ticks:{...tick,color:C.periwinkle},grid:{display:false}}}}});
      }
      const elPie=document.getElementById("chartPie");
      if(elPie){
        const counts={};
        active.forEach(p=>{counts[p.type]=(counts[p.type]||0)+1;});
        const entries=Object.entries(counts);
        charts.pie=new Chart(elPie,{type:"doughnut",data:{labels:entries.map(([n])=>n),datasets:[{data:entries.map(([,v])=>v),backgroundColor:entries.map(([n])=>TYPE_COLORS[n]||C.blue),borderWidth:2,borderColor:C.bgCard}]},options:{...base,cutout:"55%"}});
      }
    }
  }

  if(platform==="website"){
    if(period==="2025"){
      const el=document.getElementById("chart2025GA");
      if(el) charts.ga2025=new Chart(el,{type:"bar",data:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],datasets:[{label:"Sessions",data:GA_2025_SESSIONS,backgroundColor:C.green+"cc",borderRadius:3}]},options:{...base,scales:{x:{ticks:tick,grid:{color:grid}},y:{ticks:tick,grid:{color:grid}}}}});
    } else if(period!=="jul"){
      const el=document.getElementById("chartGA");
      if(el){
        let data=period==="jan"?GA_JAN:period==="feb"?GA_FEB:period==="mar"?GA_MAR:period==="apr"?GA_APR:period==="may"?GA_MAY:[...GA_JAN,...GA_FEB,...GA_MAR,...GA_APR,...GA_MAY];
        if(period==="ytd"){const step=3;data=data.filter((_,i)=>i%step===0);}
        charts.ga=new Chart(el,{type:"line",data:{labels:data.map((_,i)=>i+1+""),datasets:[{label:"Sessions",data,borderColor:C.green,backgroundColor:C.green+"22",borderWidth:2,pointRadius:0,fill:true,tension:.3}]},options:{...base,scales:{x:{ticks:{...tick,maxTicksLimit:15},grid:{color:grid}},y:{ticks:tick,grid:{color:grid},beginAtZero:true}}}});
      }
    }
  }

  if(platform==="podcast"){
    const el=document.getElementById("chartPod");
    if(el) charts.pod=new Chart(el,{type:"line",data:{labels:POD_TREND_LABELS,datasets:[{label:"Downloads",data:POD_TREND,borderColor:C.green,backgroundColor:C.green+"22",borderWidth:2,pointRadius:3,fill:true,tension:.3}]},options:{...base,scales:{x:{ticks:{...tick,maxRotation:45,autoSkip:false},grid:{color:grid}},y:{ticks:tick,grid:{color:grid},beginAtZero:true}}}});
  }
}

function attachListeners(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{platform=b.dataset.tab;renderApp();}));
  document.querySelectorAll("[data-period]").forEach(b=>b.addEventListener("click",()=>{period=b.dataset.period;renderApp();}));
  document.querySelectorAll("[data-pod]").forEach(b=>b.addEventListener("click",()=>{podSeries=b.dataset.pod;renderApp();}));
}

renderApp();
